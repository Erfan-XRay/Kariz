name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Builds without the optional transports (cargo features quic and kcp).
      - run: cargo clippy --lib --bins --no-default-features -- -D warnings
      - run: cargo clippy --lib --bins --no-default-features --features quic -- -D warnings
      - run: cargo clippy --lib --bins --no-default-features --features kcp -- -D warnings
      - run: cargo test

  # nginx in front of the tunnel as a stand-in for a CDN: WebSocket proxying, TLS
  # termination and an idle timeout (tests/tunnel.rs, module `nginx`).
  cdn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nginx-light
      - run: cargo test --test tunnel nginx -- --nocapture
        env:
          KARIZ_REQUIRE_NGINX: "1"
          KARIZ_NGINX: /usr/sbin/nginx

  # TEMPORARY (phase 4.6): Linux numbers for the README. Removed before merging.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CPU
        run: nproc && lscpu | grep -E "Model name|^CPU\(s\)"
      - name: Localhost throughput
        run: cargo test -q --release --test tunnel -- --ignored --nocapture --exact throughput
      - name: UDP
        run: |
          cargo test -q --release --test tunnel -- --ignored --nocapture --exact udp_throughput
          cargo test -q --release --test tunnel -- --ignored --nocapture --exact udp_idle_latency
