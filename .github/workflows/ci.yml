name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Builds without the optional transports (cargo features quic and kcp).
      - run: cargo clippy --lib --bins --no-default-features -- -D warnings
      - run: cargo clippy --lib --bins --no-default-features --features quic -- -D warnings
      - run: cargo clippy --lib --bins --no-default-features --features kcp -- -D warnings
      - run: cargo test

  # scripts/kariz.sh on a real systemd host: install from a local build, a tcpmux pair
  # and a wss pair (self-signed certificate and pin), traffic through both, the banner
  # in the journal without its priority prefix, then removal.
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: shellcheck scripts/*.sh
      - run: cargo build --release --locked
      - name: Install with the manager
        run: |
          sudo scripts/kariz.sh install --binary target/release/kariz
          kariz-manager help >/dev/null
      - name: Tunnels through the manager
        run: |
          python3 -m http.server 18081 --bind 127.0.0.1 >/dev/null 2>&1 &
          token() { sudo sed -n 's/^token = "\(.*\)"/\1/p' "/etc/kariz/$1.toml"; }
          sudo kariz-manager add plain --role entry --mode reverse --transport tcpmux \
            --listen 127.0.0.1:3080 --forward 127.0.0.1:18080=127.0.0.1:18081 --public-ip 127.0.0.1
          sudo kariz-manager add plain-exit --role exit --mode reverse --transport tcpmux \
            --remote 127.0.0.1:3080 --token "$(token plain)"
          # wss: the listening side first; it prints the pin for the dialing side.
          out=$(sudo kariz-manager add secure-exit --role exit --mode direct --transport wss \
            --listen 127.0.0.1:3443 --ws-path /manager-test --public-ip 127.0.0.1)
          echo "$out"
          pin=$(echo "$out" | sed -n 's/.*--pin \([0-9a-f]*\).*/\1/p')
          test -n "$pin"
          sudo kariz-manager add secure --role entry --mode direct --transport wss \
            --remote 127.0.0.1:3443 --forward 127.0.0.1:18082=127.0.0.1:18081 \
            --ws-path /manager-test --pin "$pin" --token "$(token secure-exit)"
          sleep 3
          sudo kariz-manager list
          curl -sf --max-time 5 http://127.0.0.1:18080/ >/dev/null
          curl -sf --max-time 5 http://127.0.0.1:18082/ >/dev/null
      - name: The menu and its wizard, with scripted answers
        run: |
          # menu: 2 = new tunnel, then the wizard's answers, Enter to return, 0 = exit
          printf '%s\n' 2 wiz entry reverse tcpmux balanced 3090 127.0.0.1 y \
            18083=127.0.0.1:18081 '' '' 0 > answers.txt
          sudo env KARIZ_INPUT="$PWD/answers.txt" kariz-manager
          sudo kariz-manager list | tee list.txt
          grep -q "wiz .*active" list.txt
          sudo grep -q 'listen = "0.0.0.0:18083"' /etc/kariz/wiz.toml
      - name: Update restarts running tunnels
        run: |
          out=$(sudo kariz-manager update --binary target/release/kariz)
          echo "$out"
          echo "$out" | grep -q "5 running tunnel(s) restarted"
          sleep 3
          curl -sf --max-time 5 http://127.0.0.1:18080/ >/dev/null
      - name: Banner in the journal, priority prefixes understood
        run: |
          sudo journalctl -u kariz@plain -o cat --no-pager | tee journal.txt | head -20
          grep -q "developed by ErfanXRay" journal.txt
          ! grep -q '^<[0-9]>' journal.txt
      - name: Remove and uninstall
        run: |
          for t in plain plain-exit secure secure-exit wiz; do sudo kariz-manager remove "$t" --yes; done
          sudo kariz-manager uninstall --yes
          test ! -e /usr/local/bin/kariz
      - if: failure()
        run: sudo journalctl -u 'kariz@*' --no-pager -n 200

  # TEMPORARY (phase 8.1), removed before merge: mimalloc against musl's own allocator,
  # static musl builds, alternating runs.
  bench-musl:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build both binaries
        run: |
          cargo build --release --locked --target "$TARGET"
          cp "target/$TARGET/release/kariz" kariz-mimalloc
          cargo build --release --locked --target "$TARGET" --no-default-features --features quic,kcp
          cp "target/$TARGET/release/kariz" kariz-musl
          ls -l kariz-mimalloc kariz-musl
      - name: Memory
        run: |
          # musl: 6.0 MiB idle. mimalloc untuned: 15.6 (MIMALLOC_ARENA_EAGER_COMMIT=0: 8.1).
          # kariz-mimalloc now sets that option itself (src/allocator.rs); the two
          # variants below compare the built-in setting with the environment variable.
          run() {
            label=$1; bin=$2; shift 2
            echo "== $label"
            env "$@" scripts/rss.sh tcpmux 100 "$bin" 2>&1 | grep "^transport"
            env "$@" scripts/rss.sh tcpmux 1000 "$bin" udp 2>&1 | grep "^transport"
          }
          run "musl" ./kariz-musl X=1
          run "mimalloc, built-in setting" ./kariz-mimalloc X=1
          run "mimalloc, env variable set too" ./kariz-mimalloc MIMALLOC_ARENA_EAGER_COMMIT=0
          run "mimalloc, arenas off too" ./kariz-mimalloc MIMALLOC_ARENA_EAGER_COMMIT=0 MIMALLOC_DISALLOW_ARENA_ALLOC=1
      - name: Bulk throughput with the setting, alternating
        run: |
          for round in 1 2 3; do
            for alloc in mimalloc musl; do
              if [ "$alloc" = mimalloc ]; then feats=""; else feats="--no-default-features --features quic,kcp"; fi
              echo "== $alloc, round $round"
              cargo test --release --locked --target "$TARGET" $feats --test tunnel throughput                 -- --ignored --nocapture --exact 2>&1 | grep "each way" || true
            done
          done

  # nginx in front of the tunnel as a stand-in for a CDN: WebSocket proxying, TLS
  # termination and an idle timeout (tests/tunnel.rs, module `nginx`).
  cdn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nginx-light
      - run: cargo test --test tunnel nginx -- --nocapture
        env:
          KARIZ_REQUIRE_NGINX: "1"
          KARIZ_NGINX: /usr/sbin/nginx
