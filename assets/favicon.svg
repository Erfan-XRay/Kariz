<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Kariz</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14406d"/>
      <stop offset="1" stop-color="#081a2e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fb5a8"/>
      <stop offset="1" stop-color="#7ef0e4"/>
    </linearGradient>
    <clipPath id="badge"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <!-- earth below the surface -->
    <rect y="25" width="64" height="39" fill="#0b2237"/>
    <!-- two wells with their mounds: a qanat seen from the side -->
    <g fill="#e9c46a">
      <path d="M9 25 a8 7 0 0 1 16 0 Z"/>
      <path d="M33 25 a8 7 0 0 1 16 0 Z"/>
      <rect x="15" y="25" width="4" height="26"/>
      <rect x="39" y="25" width="4" height="28"/>
    </g>
    <!-- the surface -->
    <rect y="24" width="64" height="3.5" fill="#e9c46a"/>
    <!-- the channel, sloping to the outlet -->
    <path d="M-2 42 L66 52" stroke="#04101c" stroke-width="13" stroke-linecap="butt"/>
    <path d="M-2 42 L66 52" stroke="url(#water)" stroke-width="8" stroke-linecap="butt"/>
  </g>
</svg>
