<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Kariz</title>
  <desc id="d">Kariz: a fast, light tunnel core in Rust</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12365e"/>
      <stop offset="1" stop-color="#081a2e"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22384f"/>
      <stop offset="1" stop-color="#0b1f34"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a9e93"/>
      <stop offset="0.7" stop-color="#34d0c3"/>
      <stop offset="1" stop-color="#7ef0e4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ef0e4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7ef0e4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#e9c46a">
      <circle cx="930" cy="48" r="2.2" opacity="0.8"/>
      <circle cx="1040" cy="92" r="1.6" opacity="0.6"/>
      <circle cx="1168" cy="40" r="2" opacity="0.7"/>
      <circle cx="846" cy="120" r="1.3" opacity="0.5"/>
      <circle cx="1216" cy="130" r="1.4" opacity="0.5"/>
    </g>

    <!-- name and tagline -->
    <text x="72" y="118" fill="#ffffff" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
          font-size="92" font-weight="700" letter-spacing="1">Kariz</text>
    <text x="352" y="116" fill="#e9c46a" font-family="Vazirmatn, 'Segoe UI', Tahoma, sans-serif"
          font-size="54" font-weight="600">کاریز</text>
    <text x="74" y="170" fill="#a9c4e0" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
          font-size="28">A fast, light tunnel core in Rust</text>

    <!-- ground -->
    <path d="M0 206 H1280 V320 H0 Z" fill="url(#earth)"/>
    <path d="M0 206 H1280" stroke="#e9c46a" stroke-width="4"/>

    <!-- shafts with their mounds, reaching down to the sloping channel -->
    <g stroke="#e9c46a" stroke-width="5" stroke-linecap="round" opacity="0.55">
      <path d="M180 206 V246"/>
      <path d="M340 206 V250"/>
      <path d="M500 206 V254"/>
      <path d="M660 206 V258"/>
      <path d="M820 206 V262"/>
      <path d="M980 206 V266"/>
    </g>
    <g fill="#e9c46a">
      <path d="M166 206 a14 10 0 0 1 28 0 Z"/>
      <path d="M326 206 a14 10 0 0 1 28 0 Z"/>
      <path d="M486 206 a14 10 0 0 1 28 0 Z"/>
      <path d="M646 206 a14 10 0 0 1 28 0 Z"/>
      <path d="M806 206 a14 10 0 0 1 28 0 Z"/>
      <path d="M966 206 a14 10 0 0 1 28 0 Z"/>
    </g>

    <!-- the channel and its outlet -->
    <path d="M60 246 L1150 272" stroke="#06121f" stroke-width="30" stroke-linecap="round"/>
    <path d="M60 246 L1150 272" stroke="url(#water)" stroke-width="18" stroke-linecap="round"/>
    <path d="M80 247 L1130 271" stroke="#e8fffc" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="22 26" opacity="0.75"/>
    <circle cx="1180" cy="273" r="46" fill="url(#glow)"/>
    <path d="M1160 248 L1206 273 L1160 298 Z" fill="#7ef0e4" stroke="#7ef0e4" stroke-width="7"
          stroke-linejoin="round"/>
  </g>
</svg>
