# Entry side, direct mode: we dial the exit side for every user connection.
role = "entry"
mode = "direct"
profile = "balanced"

[tunnel]
transport = "tcp"      # tcp | tcpmux | ws | wss; see the other samples
remote = "EXIT_SERVER_IP:3080"
token = "CHANGE-ME-run-kariz-token"
# encryption = "auto"   # auto | chacha20-poly1305 | aes-256-gcm | none
#                        # "auto" picks AES-GCM on CPUs with AES instructions, else ChaCha20;
#                        # on the listening side it accepts both. Use "none" on both sides or neither.

[[forward]]
listen = "0.0.0.0:443"
target = "127.0.0.1:443"
# protocol = "tcp"          # tcp | udp | tcp+udp (see entry-udp-reverse.toml)

# Every field is optional and overrides the profile default.
[tuning]
nodelay = true
buffer_size = 65536
keepalive_secs = 30
dial_timeout_secs = 10
handshake_timeout_secs = 10
# threads = 2   # default: one per CPU core

[log]
level = "info"
