# Entry side (public server users connect to, e.g. in Iran), reverse mode:
# the exit side connects to us on tunnel.listen.
role = "entry"
mode = "reverse"
profile = "balanced"   # balanced | throughput | gaming

[tunnel]
transport = "tcp"      # tcp | tcpmux | ws | wss; see the other samples
listen = "0.0.0.0:3080"
token = "CHANGE-ME-run-kariz-token"
# encryption = "auto"   # auto | chacha20-poly1305 | aes-256-gcm | none
#                        # "auto" picks AES-GCM on CPUs with AES instructions, else ChaCha20;
#                        # on the listening side it accepts both. Use "none" on both sides or neither.

[[forward]]
listen = "0.0.0.0:443"
target = "127.0.0.1:443"   # resolved and dialed on the exit side
# protocol = "tcp"          # tcp | udp | tcp+udp (see entry-udp-reverse.toml)

[[forward]]
listen = "0.0.0.0:8080"
target = "127.0.0.1:80"

[log]
level = "info"
