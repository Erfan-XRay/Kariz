# Exit side (abroad), direct mode, behind a CDN (Cloudflare, SSL/TLS mode "Full
# (strict)"): the CDN connects to us over wss. Pair: entry-wss-cdn.toml.
# For SSL/TLS mode "Flexible", use transport = "ws", listen on port 80 (or 8080) and
# drop [tunnel.tls]. Setup and checklist: docs/CDN.md.
role = "exit"
mode = "direct"
profile = "balanced"

[tunnel]
transport = "wss"
listen = "0.0.0.0:443"             # a port the CDN proxies (443, 2053, 2083, 2087, 2096, 8443)
token = "CHANGE-ME-run-kariz-token"

[tunnel.ws]
path = "/api/v1/stream"            # every other path gets nginx's 404 page
host = "tunnel.example.com"        # optional: also reject requests for other hosts

[tunnel.tls]
cert = "/etc/kariz/origin.pem"     # Cloudflare Origin CA or Let's Encrypt certificate chain
key = "/etc/kariz/origin.key"      # reloaded automatically when the files change

[log]
level = "info"
