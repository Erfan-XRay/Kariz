# Exit side (server abroad), reverse mode: we connect out to the entry side
# and keep `pool` idle connections ready.
role = "exit"
mode = "reverse"
profile = "balanced"

[tunnel]
transport = "tcp"      # tcp | tcpmux | ws | wss; see the other samples
remote = "ENTRY_SERVER_IP:3080"
token = "CHANGE-ME-run-kariz-token"
# encryption = "auto"   # auto | chacha20-poly1305 | aes-256-gcm | none
#                        # "auto" picks AES-GCM on CPUs with AES instructions, else ChaCha20;
#                        # on the listening side it accepts both. Use "none" on both sides or neither.
pool = 8

[log]
level = "info"
