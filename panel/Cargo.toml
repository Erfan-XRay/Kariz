[package]
name = "kariz-panel"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
description = "The Kariz web panel: sign-in, servers, tunnels, live monitoring."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "kariz-panel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["std", "password-hash"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "http1", "tokio", "service"] }
kariz = { path = "..", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rust-embed = "8"
# Bundled SQLite: the binary stays static, like the core.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
