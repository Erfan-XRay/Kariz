[package]
name = "kariz"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "High-performance, resource-efficient tunnel core for server-to-server links, built to resist DPI."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "kariz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
httparse = "1.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "0.11", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
