[package]
name = "kariz"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "High-performance, resource-efficient tunnel core for server-to-server links, built to resist DPI."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "kariz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
